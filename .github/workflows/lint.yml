name: Lint

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.14

      - name: Compile project-owned Python
        run: >-
          python -m compileall -q
          python-package/employee_events
          report
          tests

      - name: Install the pinned linter
        run: python -m pip install flake8==7.1.1

      - name: Lint project-owned Python
        run: >-
          python -m flake8
          python-package/setup.py
          python-package/employee_events
          report
          tests
